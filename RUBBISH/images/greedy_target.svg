<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="bold" fill="#222">图2　贪心追踪：每步朝目标 Z 走，误差每层减半</text>

  <!-- 单位圆盘 -->
  <circle cx="320" cy="225" r="150" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="475" y="130" font-size="15" fill="#222">单位圆盘（归一化后）</text>

  <!-- 误差圆：|Z - cn| <= rn -->
  <circle cx="382.4" cy="183.4" r="75" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,5"/>
  <text x="430" y="118" font-size="13" fill="#888">误差 ≤ x/2</text>
  <circle cx="351.2" cy="204.2" r="37.5" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,5"/>
  <text x="398" y="224" font-size="12" fill="#888">≤ x/4</text>
  <circle cx="366.8" cy="193.8" r="18.75" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="5,5"/>
  <text x="392" y="172" font-size="11" fill="#888">≤ x/8</text>

  <!-- 箭头 marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d32f2f"/>
    </marker>
  </defs>

  <!-- 贪心折线 -->
  <line x1="320" y1="225" x2="382.4" y2="183.4" stroke="#d32f2f" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="382.4" y1="183.4" x2="351.2" y2="204.2" stroke="#d32f2f" stroke-width="2.2" marker-end="url(#arr)"/>
  <line x1="351.2" y1="204.2" x2="366.8" y2="193.8" stroke="#d32f2f" stroke-width="2.2" marker-end="url(#arr)"/>

  <!-- 点 -->
  <circle cx="320" cy="225" r="5" fill="#222"/>
  <text x="306" y="246" font-size="15" fill="#222">c₀</text>
  <circle cx="382.4" cy="183.4" r="4.5" fill="#d32f2f"/>
  <text x="391" y="180" font-size="14" fill="#d32f2f">c₁</text>
  <circle cx="351.2" cy="204.2" r="4.5" fill="#d32f2f"/>
  <text x="330" y="197" font-size="14" fill="#d32f2f">c₂</text>
  <circle cx="366.8" cy="193.8" r="4.5" fill="#d32f2f"/>
  <text x="377" y="207" font-size="14" fill="#d32f2f">c₃</text>

  <!-- 目标 Z -->
  <circle cx="380" cy="185" r="7" fill="#e91e63"/>
  <text x="392" y="160" font-size="17" font-weight="bold" fill="#e91e63">目标 Z</text>

  <text x="30" y="415" font-size="15" fill="#555">每一步都朝 Z 走最大的一步（当前半径的一半），误差从 x → x/2 → x/4 → x/8 递减，无穷步后误差为 0。</text>
</svg>
