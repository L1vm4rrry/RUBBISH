<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUBBISH - HGS奖</title>
    <script src="theme.js?v=20260830"></script>
    <link rel="stylesheet" href="style.css?v=20260830d">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body>

    <div class="container">
        <header class="site-header">
            <div class="header-top">
                <h1 class="logo">RUBBISH<span class="page-subtitle"> - HGS奖</span></h1>
                <p class="tagline">The Home For Academic Trash</p>
            </div>
            
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="nav-home">← 返回首页</a></li>
                    <li><a href="explore.html">探索</a></li>
                    <li><a href="about.html">关于</a></li>
                    <li><a href="publish.html">合作出版</a></li>
                    <li><a href="subscribe.html">订阅</a></li>
                    <li><a href="bin.html">投稿</a></li>
                    <li><a href="hgs.html" class="nav-current" style="color: #D4AF37;">HGS奖</a></li>
                </ul>
            </nav>
        </header>

        <main class="content">
            <div class="hgs-hero">
                <h1 class="hgs-main-title">HGS</h1>
                <p class="hgs-tagline">The High-Grade Stupidity Award / 高等愚蠢奖</p>
                <p class="hgs-tagline" style="color: #B8860B;">每年评选五篇最“优质”的垃圾！</p>
            </div>

            <!-- 动态渲染获奖区（只显示摘要和查看原文） -->
            <div id="hgs-list"></div>
        </main>

        <footer class="footer">
            © 2026 RUBBISH. 所有的废纸都会被认真对待。
        </footer>
    </div>

    <script src="articles.js?v=20260830e"></script>
    <script>
        const hgsList = document.getElementById('hgs-list');
        let currentIssue = '';
        hgsAwards.forEach(award => {
            // 同一届的奖项分组显示（届名变化时才输出分组标题）
            if (award.issue !== currentIssue) {
                currentIssue = award.issue;
                hgsList.innerHTML += `<div class="hgs-issue-header">${currentIssue} 获奖名单</div>`;
            }
            hgsList.innerHTML += `
                <div class="hgs-card">
                    <div class="hgs-issue">${award.issue}</div>
                    <div class="hgs-winner">${award.title}</div>
                    <div class="hgs-author">获奖者：${award.author}</div>
                    
                    <!-- 摘要区（样式统一放在 style.css，自动适配夜间模式） -->
                    <div class="hgs-summary">
                        <strong>摘要：</strong>${award.summary}
                    </div>

                    <!-- 查看原文按钮 -->
                    <a href="${award.url}" class="hgs-read-btn">查看原文 →</a>
                </div>
            `;
        });
    </script>
    
</body>
</html>
