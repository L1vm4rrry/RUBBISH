<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="450" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="bold" fill="#222">图1　两点确定一次函数 y = kx + b</text>

  <!-- 坐标轴 -->
  <line x1="100" y1="380" x2="590" y2="380" stroke="#222" stroke-width="2"/>
  <line x1="100" y1="380" x2="100" y2="40" stroke="#222" stroke-width="2"/>
  <polygon points="590,380 578,374 578,386" fill="#222"/>
  <polygon points="100,40 94,52 106,52" fill="#222"/>
  <text x="596" y="384" font-size="14" fill="#222">x</text>
  <text x="90" y="44" font-size="14" fill="#222">y</text>
  <text x="92" y="392" font-size="14" fill="#222">O</text>

  <!-- 直线 y=kx+b -->
  <line x1="150" y1="90" x2="560" y2="350" stroke="#1565c0" stroke-width="2.5"/>
  <text x="455" y="120" font-size="17" fill="#1565c0" font-style="italic">y = kx + b</text>

  <!-- 两点 -->
  <circle cx="250" cy="160" r="5.5" fill="#d32f2f"/>
  <text x="255" y="148" font-size="16" fill="#b71c1c">(x₁, y₁)</text>
  <circle cx="440" cy="290" r="5.5" fill="#d32f2f"/>
  <text x="448" y="300" font-size="16" fill="#b71c1c">(x₂, y₂)</text>

  <!-- 直角三角形（Δx, Δy） -->
  <line x1="250" y1="160" x2="440" y2="160" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4"/>
  <line x1="440" y1="160" x2="440" y2="290" stroke="#999" stroke-width="1.4" stroke-dasharray="6,4"/>
  <text x="330" y="152" font-size="14" fill="#888">Δx = x₂ − x₁</text>
  <text x="448" y="225" font-size="14" fill="#888">Δy</text>

  <text x="30" y="425" font-size="15" fill="#555">由 ① y₁ = kx₁ + b 与 ② y₂ = kx₂ + b 相减，得 k = (y₁ − y₂) / (x₁ − x₂)。</text>
</svg>
