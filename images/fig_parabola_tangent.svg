<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="bold" fill="#222">图2　求过 A(−1, 13/2) 且与 f(x) 相切的直线</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="390" x2="600" y2="390" stroke="#222" stroke-width="2"/>
  <line x1="120" y1="390" x2="120" y2="40" stroke="#222" stroke-width="2"/>
  <polygon points="600,390 588,384 588,396" fill="#222"/>
  <polygon points="120,40 114,52 126,52" fill="#222"/>
  <text x="606" y="394" font-size="14" fill="#222">x</text>
  <text x="110" y="44" font-size="14" fill="#222">y</text>
  <text x="112" y="404" font-size="14" fill="#222">O</text>

  <!-- 抛物线 f(x) = 1.5x^2 - 2x + 3 -->
  <path d="M 120 120 C 200 200, 300 280, 380 300 C 420 308, 470 302, 520 270 C 550 250, 580 215, 600 180" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="470" y="120" font-size="16" fill="#2e7d32">f(x) = (3/2)x² − 2x + 3</text>

  <!-- 切线 g(x) = -5x + 3/2 -->
  <line x1="132" y1="56" x2="310" y2="392" stroke="#d32f2f" stroke-width="2.4"/>
  <text x="360" y="330" font-size="16" fill="#b71c1c">g(x) = −5x + 3/2</text>

  <!-- 点 A -->
  <circle cx="132" cy="56" r="6" fill="#e91e63"/>
  <text x="20" y="60" font-size="16" font-weight="bold" fill="#e91e63">A(−1, 13/2)</text>

  <text x="30" y="422" font-size="15" fill="#555">联立 g(x)=f(x) 并令 Δ=0，解得 k = −5，b = 3/2；切线过 A 且与抛物线相切。</text>
</svg>
