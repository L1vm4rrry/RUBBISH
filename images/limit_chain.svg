<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="sans-serif">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
  <text x="30" y="38" font-size="19" font-weight="bold" fill="#222">图1　三层圆链构造示意：每层以「圆心—接触点」连线为直径</text>

  <!-- 大圆 O0 -->
  <circle cx="320" cy="215" r="150" fill="none" stroke="#222" stroke-width="2.5"/>
  <text x="482" y="120" font-size="16" fill="#222">O₀（半径 x）</text>
  <line x1="473" y1="117" x2="452" y2="105" stroke="#999" stroke-width="1.2"/>

  <!-- 直径线段 C0-P1 -->
  <line x1="320" y1="215" x2="245" y2="345" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- 圆 O1 -->
  <circle cx="282.5" cy="280" r="75" fill="none" stroke="#d32f2f" stroke-width="2.2"/>
  <text x="236" y="192" font-size="15" fill="#d32f2f">O₁（x/2）</text>

  <!-- 直径线段 C1-P2 -->
  <line x1="282.5" y1="280" x2="353" y2="254.3" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- 圆 O2 -->
  <circle cx="317.8" cy="267.1" r="37.5" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="360" y="263" font-size="14" fill="#1565c0">O₂（x/4）</text>

  <!-- 直径线段 C2-P3 -->
  <line x1="317.8" y1="267.1" x2="354" y2="276.8" stroke="#999" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- 圆 O3 -->
  <circle cx="335.9" cy="272" r="18.75" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <text x="358" y="300" font-size="13" fill="#2e7d32">O₃（x/8）→ 极限点 L</text>

  <!-- 圆心 -->
  <circle cx="320" cy="215" r="4.5" fill="#222"/>
  <text x="326" y="210" font-size="15" fill="#222">C₀</text>
  <circle cx="282.5" cy="280" r="4.5" fill="#d32f2f"/>
  <text x="262" y="298" font-size="14" fill="#d32f2f">C₁</text>
  <circle cx="317.8" cy="267.1" r="4" fill="#1565c0"/>
  <text x="300" y="258" font-size="13" fill="#1565c0">C₂</text>
  <circle cx="335.9" cy="272" r="3.5" fill="#2e7d32"/>
  <text x="322" y="252" font-size="12" fill="#2e7d32">C₃</text>

  <!-- 接触点 -->
  <circle cx="245" cy="345" r="4.5" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
  <text x="236" y="366" font-size="15" fill="#b71c1c">P₁</text>
  <circle cx="353" cy="254.3" r="4" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="360" y="246" font-size="14" fill="#1565c0">P₂</text>
  <circle cx="354" cy="276.8" r="3.5" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="362" y="288" font-size="13" fill="#2e7d32">P₃</text>

  <text x="30" y="415" font-size="15" fill="#555">接触点 Pₙ 可在上一圆上任意转动（即每一步方向任意）；每层半径减半：x → x/2 → x/4 → x/8 → …</text>
</svg>
